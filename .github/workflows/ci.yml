name: Build and test

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Windows build and test
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          lfs: false
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build SkyBrowser.slnx -c Release --artifacts-path ./artifacts
      - name: Scientific, cache and WPF integration tests
        run: dotnet test tests/SkyBrowser.Tests -c Release --artifacts-path ./artifacts --no-build --logger 'trx;LogFileName=tests.trx' --results-directory ./artifacts/test-results
      - name: Publish and validate package
        run: |
          dotnet publish src/SkyBrowser.Desktop -c Release -p:PublishProfile=WinX64 --artifacts-path ./artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
          ./tools/Test-Publish.ps1 -PublishDirectory ./artifacts/publish/SkyBrowser.Desktop/release_win-x64
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare versioned binary and complete source assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./tools/Build-Release.ps1 -Version ($env:RELEASE_TAG.Substring(1))
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            artifacts/release/*/*.zip
            artifacts/release/*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release
      - name: Publish validated assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release -type f \( -name '*.zip' -o -name 'SHA256SUMS.txt' \) -print0)
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "SkyBrowser $RELEASE_TAG" "${flags[@]}"
